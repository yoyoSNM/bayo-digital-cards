<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f2eb">
<title>Revelația fericirii/The Revelation of Happiness — Eugenia Drăgoi-Banciu</title>
<meta name="description" content="Colecția Revelația fericirii/The Revelation of Happiness, de Eugenia Drăgoi-Banciu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f6f2eb;--ink:#292923;--muted:#777168;--line:#ded7cb;--accent:#718ba0;--white:#fffdf9}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif}
a{color:inherit}
.hero{position:relative;max-width:1400px;margin:0 auto;padding:24px 5% 0}
.brand-logo{position:absolute;top:18px;left:5%;width:62px;height:auto;display:block;z-index:2}
.brand-logo img{display:block;width:100%;height:auto}
.cover{display:block;width:100%;max-height:560px;overflow:hidden;background:#e8e0d4;cursor:pointer}
.cover img{display:block;width:100%;max-height:560px;object-fit:contain}
.intro{text-align:center;padding:24px 12px 22px}.eyebrow{margin:0 0 20px;color:var(--muted);font-size:12px;letter-spacing:4px;text-transform:uppercase}.intro-actions{padding:24px 12px 30px}
h1,h2{font-family:"Playfair Display",Georgia,serif;font-weight:400}
h1{margin:0 0 12px;font-size:clamp(34px,5.2vw,66px);line-height:1.08;letter-spacing:-1.2px}
.collection-title{margin:0;color:var(--accent);font-size:clamp(13px,1.5vw,16px);letter-spacing:2.2px;text-transform:uppercase}
.primary-actions{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;margin-top:25px}
.button{position:relative;display:inline-flex;justify-content:center;align-items:center;min-width:180px;padding:15px 28px 17px;border:1px solid var(--ink);border-bottom:0;background:var(--ink);color:var(--white);font-size:12px;letter-spacing:1.2px;text-decoration:none;text-transform:uppercase;cursor:pointer;overflow:hidden}.button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--accent)}
.button.secondary{background:transparent;color:var(--ink);border-color:var(--line)}
.quick-contact{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:18px;font-size:12px;color:var(--muted)}
.quick-contact a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}
.gallery-view,.art-view{display:none}
body.gallery-open .landing{display:none}
body.gallery-open .gallery-view{display:block}
body.art-open .landing,body.art-open .gallery-view{display:none}
body.art-open .art-view{display:flex}
.gallery-section{padding:58px 6% 76px;background:var(--white);min-height:100vh}
.gallery-top{max-width:1240px;margin:0 auto 36px;display:flex;justify-content:space-between;align-items:center;gap:18px}
.gallery-top h2{margin:0;font-size:clamp(28px,4vw,42px)}
.back-link{border:1px solid var(--line);padding:12px 17px;text-decoration:none;font-size:12px;white-space:nowrap}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 22px;max-width:1240px;margin:0 auto}
.artwork{margin:0;min-width:0}
.artwork button{display:block;width:100%;padding:0;border:0;overflow:hidden;background:var(--paper);cursor:zoom-in}
.artwork img{display:block;width:100%;height:360px;object-fit:contain;transition:transform .35s ease}
.artwork button:hover img{transform:scale(1.025)}
.artwork figcaption{padding-top:12px;color:var(--muted);font-size:11px;letter-spacing:1px}
.art-view{position:fixed;inset:0;z-index:5;background:#181715;color:white;align-items:center;justify-content:center;padding:68px 22px 28px}
.art-view img{display:block;max-width:100%;max-height:calc(100vh - 130px);object-fit:contain}
.viewer-top{position:absolute;top:16px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.viewer-top button{padding:10px 14px;border:1px solid #6c6861;background:transparent;color:white;cursor:pointer;font:inherit;font-size:12px}
.viewer-count{font-size:12px;color:#ddd6cc}
.viewer-nav{position:absolute;top:50%;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}
.viewer-nav button{pointer-events:auto;width:44px;height:44px;border:1px solid #777;background:rgba(24,23,21,.6);color:white;font-size:24px;cursor:pointer}
.back-link:hover{border-color:var(--accent);background:var(--white)}
.footer{padding:22px;border-top:1px solid var(--line);color:var(--muted);text-align:center;font-size:10px;letter-spacing:2px}
@media(max-width:800px){.brand-logo{width:54px;top:14px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}.artwork img{height:300px}.gallery-section{padding:38px 5% 60px}.gallery-top{align-items:flex-start}}
@media(max-width:520px){.hero{padding:12px 4% 0}.brand-logo{top:10px;left:4%;width:46px}.intro{padding-top:42px}.cover img{max-height:300px}.intro{padding:23px 4px 30px}h1{letter-spacing:-.7px}.collection-title{font-size:11px;letter-spacing:1.6px}.primary-actions{gap:9px;margin-top:21px}.button{min-width:0;flex:1;padding:15px 12px;font-size:11px}.quick-contact{margin-top:16px}.gallery{gap:20px 10px}.artwork img{height:230px}.gallery-top{flex-direction:column}.back-link{align-self:flex-start}.viewer-nav{left:8px;right:8px}.viewer-nav button{width:38px;height:38px}}
</style>
</head>
<body>
<main>
<div class="landing">
<section class="hero" aria-labelledby="artist-name">
<a class="brand-logo" href="https://bayo.design" aria-label="BAYO Design"><img src="bayo-logo-transparent.png" alt="BAYO"></a>
<div class="intro">
<p class="eyebrow">Artă contemporană</p>
<h1 id="artist-name">Eugenia Drăgoi-Banciu</h1>
<p class="collection-title">Revelația fericirii/The Revelation of Happiness</p>
</div>
<a class="cover" href="#galerie" aria-label="Deschide galeria">
<img src="revelatia-fericirii-15.jpg" alt="Lucrare din colecția Revelația fericirii/The Revelation of Happiness">
</a>
<div class="intro intro-actions">
<div class="primary-actions">
<a class="button" href="#galerie" id="open-gallery">Vezi galeria</a>
</div>
<div class="quick-contact">
<a href="tel:+40745513453">Sună</a>
<span aria-hidden="true">·</span>
<a href="mailto:eugenial_30@yahoo.com">E-mail</a>
<span aria-hidden="true">·</span>
<a href="contact.vcf" download>Salvează contactul</a>
</div>
</div>
</section>

</div>
<section class="gallery-view gallery-section" id="galerie" aria-label="Galeria Revelația fericirii/The Revelation of Happiness">
<div class="gallery-top">
<h2>Revelația fericirii/The Revelation of Happiness</h2>
<a class="back-link" href="#" id="back-home">← Înapoi la copertă</a>
</div>
<div class="gallery" id="gallery"></div>
</section>
<section class="art-view" id="art-view" aria-label="Vizualizare lucrare">
<div class="viewer-top">
<button type="button" id="back-gallery">← Înapoi la galerie</button>
<span class="viewer-count" id="viewer-count">01 / 15</span>
<button type="button" id="close-viewer">Închide ✕</button>
</div>
<div class="viewer-nav">
<button type="button" id="prev-art" aria-label="Lucrarea precedentă">‹</button>
<button type="button" id="next-art" aria-label="Lucrarea următoare">›</button>
</div>
<img id="viewer-image" src="revelatia-fericirii-01.jpg" alt="Lucrarea 01">
</section>
</main>
<footer class="footer">BAYO DESIGN</footer>
<script>
const gallery=document.getElementById('gallery');
const viewerImage=document.getElementById('viewer-image');
const viewerCount=document.getElementById('viewer-count');
let current=0;
for(let i=1;i<=15;i++){
 const n=String(i).padStart(2,'0');
 const figure=document.createElement('figure'); figure.className='artwork';
 const button=document.createElement('button'); button.type='button'; button.setAttribute('aria-label','Deschide lucrarea '+n);
 const img=document.createElement('img'); img.src='revelatia-fericirii-'+n+'.jpg'; img.alt='Lucrarea '+n; img.loading='lazy';
 button.appendChild(img); button.addEventListener('click',()=>openArtwork(i-1));
 const caption=document.createElement('figcaption'); caption.textContent=n+' / 15';
 figure.append(button,caption); gallery.appendChild(figure);
}
function showGallery(){document.body.classList.add('gallery-open');document.body.classList.remove('art-open');window.scrollTo(0,0)}
function showHome(){document.body.classList.remove('gallery-open','art-open');window.scrollTo(0,0)}
function openArtwork(index){current=index;updateArtwork();document.body.classList.remove('gallery-open');document.body.classList.add('art-open')}
function updateArtwork(){const n=String(current+1).padStart(2,'0');viewerImage.src='revelatia-fericirii-'+n+'.jpg';viewerImage.alt='Lucrarea '+n;viewerCount.textContent=n+' / 15'}
document.getElementById('open-gallery').addEventListener('click',e=>{e.preventDefault();showGallery()});
document.querySelector('.cover').addEventListener('click',e=>{e.preventDefault();showGallery()});
document.getElementById('back-home').addEventListener('click',e=>{e.preventDefault();showHome()});
document.getElementById('back-gallery').addEventListener('click',showGallery);
document.getElementById('close-viewer').addEventListener('click',showGallery);
document.getElementById('prev-art').addEventListener('click',()=>{current=(current+14)%15;updateArtwork()});
document.getElementById('next-art').addEventListener('click',()=>{current=(current+1)%15;updateArtwork()});
document.addEventListener('keydown',e=>{if(!document.body.classList.contains('art-open'))return;if(e.key==='ArrowLeft'){current=(current+14)%15;updateArtwork()}if(e.key==='ArrowRight'){current=(current+1)%15;updateArtwork()}if(e.key==='Escape')showGallery()});
</script>
</body>
